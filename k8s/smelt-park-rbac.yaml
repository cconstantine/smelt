# Recreates the RBAC scope already granted by hand on the `homelab` cluster
# (see SME-7) for the compose-provided `k3s`
# test cluster. Applied by the `k3s-bootstrap` compose service; safe to
# `kubectl apply` repeatedly (idempotent), since state persists across
# `docker compose down`/`up` in the named `k3s` volumes.
#
# homelab's own copy of this scope predates this file and was created by
# hand — apply this same manifest there too so the two don't drift.
#
# Two namespaces: `smelt-park` for a real running `dx serve` dev instance,
# `smelt-park-test` for `cargo test --features server`'s real-cluster
# tests (`src/sandbox.rs`'s `NAMESPACE` constant resolves to whichever one
# under `#[cfg(test)]` — see its own comment). Kept strictly separate so a
# test run can never leave litter that a real dev instance later collides
# with (or vice versa) — exactly what caused a stuck `local-path`
# provisioner in this shared cluster before the split existed. Both
# namespaces are served by the same `park` ServiceAccount/token (defined
# once, in `smelt-park`; see the second Role/RoleBinding pair below for
# how `smelt-park-test` grants it the same access) — one KUBECONFIG stays
# enough for both.
apiVersion: v1
kind: Namespace
metadata:
  name: smelt-park
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: park
  namespace: smelt-park
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: park
  namespace: smelt-park
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["list", "create", "patch", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["endpoints", "events", "limitranges", "resourcequotas"]
    verbs: ["list", "get"]
  # Live memory/CPU use for the pods view (`/pods`), from metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: park
  namespace: smelt-park
subjects:
  - kind: ServiceAccount
    name: park
    namespace: smelt-park
roleRef:
  kind: Role
  name: park
  apiGroup: rbac.authorization.k8s.io
---
# Ceiling on `create_pod`'s per-pod memory_limit override (see
# SME-12's "Per-pod limit overrides") — the
# API server rejects any pod creation over this automatically, model
# override or not, so nothing in application code needs to parse or
# compare Kubernetes quantity strings itself. Only `max` is set. The API
# server fills in `default` and `defaultRequest` from it, which matters
# only for what a container leaves unset: `build_pod_spec` always sets a
# memory limit and a zero memory request. No `cpu` here at all (SME-77):
# sandbox pods have no CPU limit or request, and a `cpu` max would hand
# each container a defaulted 16-CPU limit and request, which can't be
# scheduled.
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-pod-max
  namespace: smelt-park
spec:
  limits:
    - type: Container
      max:
        memory: 64Gi
---
# `smelt-park-test` mirrors every namespaced object above, for real-cluster
# test runs — see the file-level comment for why this exists as a second
# namespace rather than reusing `smelt-park`.
apiVersion: v1
kind: Namespace
metadata:
  name: smelt-park-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: park
  namespace: smelt-park-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["list", "create", "patch", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "create", "patch", "get", "delete"]
  - apiGroups: [""]
    resources: ["endpoints", "events", "limitranges", "resourcequotas"]
    verbs: ["list", "get"]
  # Live memory/CPU use for the pods view (`/pods`), from metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get"]
---
# The subject is the *same* ServiceAccount that lives in `smelt-park` —
# RoleBindings can reference a ServiceAccount from another namespace, so
# this grants that one identity access here too rather than minting (and
# having to separately credential) a second ServiceAccount/token.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: park
  namespace: smelt-park-test
subjects:
  - kind: ServiceAccount
    name: park
    namespace: smelt-park
roleRef:
  kind: Role
  name: park
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-pod-max
  namespace: smelt-park-test
spec:
  limits:
    - type: Container
      max:
        memory: 64Gi

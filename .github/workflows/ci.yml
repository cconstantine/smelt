name: CI

# Runs every test defined in the repo — the server-feature suite (Postgres +
# real-cluster k3s sandbox tests), the WASM compile check, and the automated
# browser tier — reusing the same docker-compose.yml stack local dev already
# depends on, so there's one environment definition to keep working, not two.
# See docs/projects/plans/ci-tests-in-pr.md for the design.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute UID/GID for docker compose build
        # docker-compose.yml's `smelt` service builds its dev-user with
        # these, defaulting to 1000/1000 — match them to the runner's real
        # user so files the container writes into the bind-mounted repo
        # (target/, Cargo.lock changes) aren't owned by a mismatched uid.
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: .ci-cargo-cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Ensure cargo registry cache dir exists with correct ownership
        # On a cache miss, actions/cache leaves .ci-cargo-cache absent; a
        # plain `docker -v` bind mount then auto-creates it as root, which
        # the container's non-root `dev` user can't write into. Creating it
        # here as the runner user (matching UID/GID set above) avoids that.
        run: mkdir -p .ci-cargo-cache

      - name: Cache cargo build output
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Build dev image
        run: docker compose build smelt

      - name: Start service dependencies (postgres, docker-in-docker, k3s)
        run: docker compose up -d postgres docker k3s

      - name: Bootstrap k3s (applies RBAC, writes kubeconfig for sandbox tests)
        run: docker compose up --exit-code-from k3s-bootstrap k3s-bootstrap

      # Every `docker compose run` below mounts .ci-cargo-cache over the
      # container's cargo registry dir so downloaded crate sources survive
      # across steps (each `run` is a fresh container) and across CI runs
      # (via the actions/cache step above) — target/ already persists via
      # docker-compose.yml's `.:/app` bind mount, no extra mount needed.
      #
      # src/sandbox.rs's `include_bytes!` pulls in a pre-built
      # target/sandbox-agent/sandbox_agent — any `server`-feature build
      # (sandbox is #[cfg(feature = "server")]-gated) fails to compile
      # without it. scripts/build-sandbox-agent.sh must run first; see
      # its own header comment and src/sandbox.rs's AGENT_BINARY doc.
      - name: Build sandbox_agent
        run: |
          docker compose run --rm \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt scripts/build-sandbox-agent.sh

      # The sandbox tests create real pods against the compose-provided k3s
      # cluster, and cargo test's default parallelism means several can be
      # concurrently competing for the runner's CPU at once. Reproduced
      # locally: this is a genuine capacity shortfall, not just slower
      # scheduling — a pod that can't fit stays Pending no matter how long
      # you wait, so raising SANDBOX_RUNNING_WAIT_TIMEOUT_SECS alone
      # (tried first) didn't fix it. SANDBOX_CPU_LIMIT lowers what
      # create_pod's tests request per pod (250m here vs the 1-full-core
      # production default) so more of them fit in the runner's much
      # smaller real capacity; sandbox.rs's own SandboxManager::create
      # tests (which bypass this env var) were lowered the same way
      # directly in the test code. See docs/setup.md.
      - name: cargo test --features server
        run: |
          docker compose run --rm \
            -e SANDBOX_RUNNING_WAIT_TIMEOUT_SECS=120 \
            -e SANDBOX_CPU_LIMIT=250m \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt cargo test --features server

      - name: cargo check (wasm target)
        run: |
          docker compose run --rm \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt cargo check --no-default-features --features web --target wasm32-unknown-unknown

      - name: Browser test setup (chrome-headless-shell)
        run: |
          docker compose run --rm \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt scripts/browser-check/setup.sh

      - name: dx build --platform web
        run: |
          docker compose run --rm \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt dx build --platform web

      # Also creates a real sandbox pod (see src/browser_tests.rs) — same
      # reasoning as the step above.
      - name: Browser tests (src/browser_tests.rs)
        run: |
          docker compose run --rm \
            -e SANDBOX_RUNNING_WAIT_TIMEOUT_SECS=120 \
            -e SANDBOX_CPU_LIMIT=250m \
            -v "$PWD/.ci-cargo-cache:/home/dev/.cargo/registry" \
            smelt cargo test --features "server browser-test" -- --ignored --test-threads=1

      - name: Tear down
        if: always()
        run: docker compose down -v

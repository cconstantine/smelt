name: CI

# Runs every test defined in the repo — the server-feature suite (Postgres +
# real-cluster k3s sandbox tests), the WASM compile check, and the automated
# browser tier — reusing the same docker-compose.yml stack local dev already
# depends on, so there's one environment definition to keep working, not two.
# See SME-14 for the design.
#
# Two jobs, side by side on ARC runners of their own (homelab's arc/main.tf):
# `server` runs the server-feature suite and the quick checks, `browser` the
# browser tier. Each starts its own stack (.github/actions/start-stack), as
# both suites want a test cluster to themselves, and keeps its own build
# caches on its runner.
#
# A pull request from a fork runs on GitHub's ubuntu-latest instead: this
# repo is public, and the ARC runners are privileged Docker on homelab whose
# caches later runs build on, so code nobody here has reviewed doesn't run
# there. Without the runner's cache volume (CI_CACHE_DIR) the caches start
# empty in the checkout, so those runs build everything from scratch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only a PR's newer push cancels its older run. On main the running run
  # finishes, and a newer one waits (replacing any already waiting).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change touches anything but docs (SME-341). Docs are what
  # no build compiles in and no test reads but the repo lints: docs/, the
  # top-level *.md, and .agents/**/*.md (persona files, which the lints
  # parse with the product's own parser). Not every .md: src/turn/
  # system_prompt.md is compiled into the binary, and any src/ change moves
  # the build id. A docs-only change runs `docs` (the repo lints) instead of
  # `server` and `browser`. Anything else, a manual run, or a
  # range that can't be read counts as code, and runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch anything but docs?
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null) || base=; head=$PR_HEAD ;;
            push) base=$PUSH_BEFORE; head=$PUSH_AFTER ;;
            *) base=; head= ;;
          esac
          code=true
          # --no-renames: a file moved into docs/ still lists the path it
          # left. A here-string, not a pipe: with pipefail, `grep -q`
          # leaving early made printf's SIGPIPE read as "docs only".
          if [ -n "$base" ] && [ -n "$head" ] && changed=$(git diff --name-only --no-renames "$base" "$head" 2>/dev/null) && [ -n "$changed" ]; then
            if ! grep -qvE '^(docs/.*|[^/]+\.md|\.agents/.*\.md)$' <<<"$changed"; then
              code=false
            fi
            printf 'changed:\n%s\n' "$changed"
          fi
          echo "code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The repo lints alone, for a docs-only change: the `smelt` service with
  # no database or cluster, on the server runner's warm caches.
  docs:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'arc-runner-smelt-amd64' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The repo lints read the history (SME-340: a cited path that
        # existed once resolves).
        with:
          fetch-depth: 0

      - name: The dev image and the build caches
        uses: ./.github/actions/start-stack
        with:
          full: "false"

      - name: The repo lints (file ceiling, links, personas)
        run: |
          docker compose run --rm --no-deps \
            smelt scripts/with-cluster-lock cargo test --features server repo_lints

      - name: Stop the compose stack
        if: always()
        uses: ./.github/actions/stop-stack

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'arc-runner-smelt-amd64' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The repo lints read the history (SME-340: a cited path that
        # existed once resolves).
        with:
          fetch-depth: 0

      - name: Start the compose stack
        uses: ./.github/actions/start-stack

      # The sandbox tests create real pods against the compose-provided k3s
      # cluster. Two of them (test_dropping_without_delete_still_cleans_up_via_drain_task,
      # the sandbox lifecycle test, since split up) reliably timed out here in CI —
      # neither raising SANDBOX_RUNNING_WAIT_TIMEOUT_SECS to 120s nor
      # lowering SANDBOX_CPU_LIMIT to 250m fixed it. The diagnostics step
      # below (added when those two didn't work) found the real cause:
      # `FailedScheduling ... 0/1 nodes are available: 1 Insufficient
      # memory` — every test pod requested the production 8Gi default,
      # and this runner's node doesn't have enough allocatable memory to
      # schedule more than one such pod at a time. Not a timing issue at
      # all, which is why raising the timeout never helped. Lowered the
      # same way as CPU: src/sandbox.rs's SandboxManager::create test call
      # sites now request 128Mi instead of 8Gi, and SANDBOX_MEMORY_LIMIT
      # below does the same for create_pod's tests via the existing
      # env-var default. SME-33 gave every pod a Docker sidecar with limits
      # of its own; SANDBOX_DOCKER_MEMORY_LIMIT lowers that the same way.
      # Since SME-77 pods request no memory and have no CPU limit, so these
      # only cap what a test pod can use.
      #
      # Both test steps run through scripts/with-cluster-lock, as every
      # local run does (SME-212): it tells the tests the lock is held
      # (SMELT_CLUSTER_LOCK_HELD), and every #[sqlx::test] and real-cluster
      # test refuses to run without that. Nothing else takes this runner's
      # lock, so it never waits.
      - name: cargo test --features server
        run: |
          # The step's result is the tests', not tee's.
          set -o pipefail
          docker compose run --rm \
            -e SANDBOX_RUNNING_WAIT_TIMEOUT_SECS=120 \
            -e SANDBOX_MEMORY_LIMIT=128Mi \
            -e SANDBOX_DOCKER_MEMORY_LIMIT=256Mi \
            -e SANDBOX_IMAGE \
            smelt scripts/with-cluster-lock cargo test --features server \
            2>&1 | tee "$RUNNER_TEMP/server-tests.log"

      - name: Server test time and slow tests
        if: always()
        run: scripts/ci-test-report "$RUNNER_TEMP/server-tests.log" server 600

      - name: Dump sandbox pod diagnostics on failure
        if: failure()
        # kubectl runs *inside* the smelt service (docker compose run),
        # not on the bare runner: the kubeconfig's server address is the
        # compose-network-internal hostname `k3s`, which only resolves
        # from a container on that network. Downloading the binary onto
        # the runner and bind-mounting it in avoids needing to add it to
        # the dev image just for this diagnostic step. The `park` service
        # account's RBAC (k8s/smelt-park-rbac.yaml) has no `nodes` access,
        # so the node describe is expected to 403 — kept anyway in case
        # that ever changes, with `|| true` so it can't fail this step.
        run: |
          curl -fsSLo kubectl-diag "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x kubectl-diag
          # smelt-park-test, not smelt-park: this step follows the test run,
          # which is built under cfg(test), where sandbox::NAMESPACE is
          # smelt-park-test (src/sandbox/mod.rs) — the dev namespace holds
          # nothing these tests made (SME-186, B43). The `park` service
          # account can list pods and events in it (k8s/smelt-park-rbac.yaml).
          echo "--- pods (smelt-park-test) ---"
          docker compose run --rm smelt ./kubectl-diag get pods -n smelt-park-test -o wide || true
          echo "--- pod descriptions ---"
          docker compose run --rm smelt ./kubectl-diag describe pods -n smelt-park-test || true
          echo "--- events, most recent first ---"
          docker compose run --rm smelt ./kubectl-diag get events -n smelt-park-test --sort-by=.lastTimestamp || true
          echo "--- node describe (capacity/allocatable/conditions; may 403, RBAC has no nodes access) ---"
          docker compose run --rm smelt ./kubectl-diag describe nodes || true
          rm -f kubectl-diag

      - name: cargo check (wasm target)
        run: |
          docker compose run --rm \
            smelt cargo check --no-default-features --features web --target wasm32-unknown-unknown

      - name: No expect() or unwrap() in production code without a reason (SME-95, SME-119)
        run: |
          docker compose run --rm \
            smelt scripts/lint-expects

      # The test step's build has no -D warnings, so a warning in it, in test
      # code or not, would pass CI (SME-361). Last, so a warnings-only red
      # skips none of the checks above (review 2, L2).
      - name: No compiler warnings (server)
        if: always()
        run: scripts/ci-no-warnings "$RUNNER_TEMP/server-tests.log"

      - name: Stop the compose stack
        if: always()
        uses: ./.github/actions/stop-stack

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'arc-runner-smelt-amd64-browser' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the compose stack
        uses: ./.github/actions/start-stack

      - name: Browser test setup (chromium-headless-shell)
        run: |
          docker compose run --rm \
            smelt scripts/browser-check/setup.sh

      # dx's server half sometimes hangs after the client bundle (all this
      # step is for) is written; scripts/ci-web-bundle stops it with a
      # process dump and passes (SME-67). The step normally takes about a
      # minute; the timeout catches a hang the script doesn't.
      # Retry once. A first attempt has hit this step's timeout on a
      # docs-only commit whose parent was green minutes earlier, with nothing
      # in the log to explain it (SME-189: `dx build --platform web` at
      # 10 minutes on a one-line change to docs). The step gets 20 minutes so
      # each attempt keeps its own 10, and a genuine hang still fails — just
      # 10 minutes later, and with the first attempt's output above it.
      - name: dx build --platform web
        timeout-minutes: 20
        run: |
          attempt=1
          until docker compose run --rm \
              smelt scripts/ci-web-bundle; do
            if [ "$attempt" -ge 2 ]; then exit 1; fi
            echo "::warning::attempt $attempt of dx build --platform web failed; retrying once (SME-189)"
            attempt=$((attempt + 1))
          done

      # Also creates a real sandbox pod (see src/browser_tests/) — the
      # server job's notes on the test pods' limits and the cluster lock
      # apply here too.
      - name: Browser tests (src/browser_tests/)
        run: |
          # The step's result is the tests', not tee's.
          set -o pipefail
          docker compose run --rm \
            -e SANDBOX_RUNNING_WAIT_TIMEOUT_SECS=120 \
            -e SANDBOX_MEMORY_LIMIT=128Mi \
            -e SANDBOX_DOCKER_MEMORY_LIMIT=256Mi \
            -e SANDBOX_IMAGE \
            -e RUST_TEST_NOCAPTURE=1 \
            smelt scripts/with-cluster-lock cargo test --features "server browser-test" -- --ignored --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/browser-tests.log"

      - name: Browser test time and slowest scenarios
        if: always()
        run: scripts/ci-test-report "$RUNNER_TEMP/browser-tests.log" browser 480

      - name: Dump sandbox pod diagnostics on failure (browser tests)
        if: failure()
        run: |
          curl -fsSLo kubectl-diag "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x kubectl-diag
          # The browser tests serve the app in-process (src/browser_tests/harness.rs)
          # under cfg(test), so their pods are in smelt-park-test (SME-186, B43).
          echo "--- pods (smelt-park-test) ---"
          docker compose run --rm smelt ./kubectl-diag get pods -n smelt-park-test -o wide || true
          echo "--- pod descriptions ---"
          docker compose run --rm smelt ./kubectl-diag describe pods -n smelt-park-test || true
          echo "--- events, most recent first ---"
          docker compose run --rm smelt ./kubectl-diag get events -n smelt-park-test --sort-by=.lastTimestamp || true
          rm -f kubectl-diag

      # The `browser-test` feature's code is compiled only in this job's test
      # step (SME-361). After the diagnostics: those are for a test failure.
      - name: No compiler warnings (browser)
        if: always()
        run: scripts/ci-no-warnings "$RUNNER_TEMP/browser-tests.log"

      - name: Stop the compose stack
        if: always()
        uses: ./.github/actions/stop-stack

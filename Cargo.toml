[package]
name = "smelt"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["sync", "macros", "time"] }
# For frontend/pages/chat.rs's edit_file diff rendering — pure Rust, no
# OS-specific dependencies in its line-diff engine, so it compiles under
# both `server` and `web` (wasm32-unknown-unknown) targets. Not
# feature-gated for that reason — see
# SME-11's "Diff rendering."
similar = "2.7"
# For frontend/pages/chat.rs's live browsing-panel keydown handling
# (`browser_input_event_for_key`, matching against `keyboard_types::Key`)
# — already present transitively (pulled in by `dioxus-html`), same
# "explicit edge" reasoning as `url`/`http`/`percent-encoding` elsewhere
# in this file. Compiles on both targets (pure Rust, no OS-specific
# pieces), same as `similar` above, so not feature-gated either.
keyboard-types = "0.7"
# For src/markdown.rs and src/highlight.rs: the model's replies render as
# markdown (SME-30). pulldown-cmark is an event parser (no HTML output
# used: smelt builds its own node tree and renders Dioxus elements, so raw
# HTML in a reply stays text); syntect + two-face highlight code blocks
# into class-named spans with the pure-Rust regex engine. All three build
# for wasm32-unknown-unknown, so not feature-gated.
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Server-only dependencies (not WASM-compatible)
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
# "json" enables serde_json::Value <-> JSONB mapping — needed by
# mcp_servers.extra_headers (see SME-15).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "chrono", "json"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
futures-util = { version = "0.3", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "ws"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_34"], optional = true }
# For sandbox_agent's send_signal handling: killpg on a discovered process
# group, bypassing the inner shell entirely — see
# SME-9's "Signaling a running command."
# "process" is for src/headless_chrome.rs: prctl(PR_SET_PDEATHSIG) so the
# shared Chrome dies with smelt instead of being orphaned.
nix = { version = "0.29", default-features = false, features = ["signal", "process"], optional = true }
# For src/sandbox.rs's client-side WebSocket handshake over a portforwarded
# raw stream (kube's own "ws" feature only covers exec/attach, not an
# arbitrary application-level WS server like sandbox_agent's).
tokio-tungstenite = { version = "0.29", optional = true }
# For sandbox_agent's file-tool content hashing (staleness detection on
# edit_file/write_file) — see SME-11.
sha2 = { version = "0.10", optional = true }
# For sandbox_agent's glob/grep tools — ignore walks a directory tree
# respecting .gitignore (the same crate ripgrep itself is built on) and
# regex is the content-search engine grep needs. Neither is used outside
# sandbox_agent, but both need a direct [dependencies] entry to be usable
# from our own code at all — see SME-19.
ignore = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
# For single-pattern glob matching ("does this path match this one
# pattern") used by both glob itself and grep's optional glob filter.
# ignore::overrides::Override looked like it should cover this without a
# second crate, but its real shape (checked in
# ~/.cargo/registry/src, not assumed) is a whitelist/gitignore-precedence
# matcher tied to a root directory — built for filtering a walk, not a
# plain pure match check. globset::Glob::compile_matcher() is the actual
# fit, and costs nothing new in the dependency tree — ignore already pulls
# it in transitively.
globset = { version = "0.4", optional = true }
# kube's rustls-tls stack only auto-installs a default CryptoProvider when
# built with its aws-lc-rs feature (which needs cmake/nasm); this project
# uses ring instead (same backend reqwest's own rustls-tls already pulls
# in via __rustls-ring, avoiding a second crypto backend in the binary),
# which kube does NOT auto-install — see main.rs's explicit
# install_default() call.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# CDP-native (talks directly to chrome-headless-shell, no chromedriver to
# download/manage) — originally added for src/browser_tests.rs's
# comprehensive sandbox-visibility check (see
# SME-10's "Why
# chromiumoxide"), now also a real runtime dependency of src/webfetch.rs
# (a real headless browser is the actual mechanism behind the `webfetch`
# tool, not just a test tool) — see SME-21.
chromiumoxide = { version = "0.7", optional = true }
# For src/mcp.rs's MCP (Model Context Protocol) client — the official Rust
# SDK, handles the Streamable HTTP transport (both plain-JSON and SSE-upgrade
# response modes) and server-initiated notifications so smelt doesn't
# hand-roll the wire protocol — see SME-15.
# "reqwest-tls-no-provider" is required separately from
# "transport-streamable-http-client-reqwest": rmcp wires TLS (rustls) only
# behind its reqwest feature names, not behind the transport feature;
# without one, connecting to any https:// MCP server fails at runtime with
# a "scheme is not http" error, found against a real https:// server. The
# "-no-provider" variant keeps reqwest 0.13 from bringing aws-lc-rs as a
# second crypto backend (SME-60): it uses the process-wide ring provider,
# which `mcp::install_crypto_provider` makes sure is installed.
# rmcp's server side (the #[cfg(test)] mock MCP server) is a
# dev-dependency, below.
# For src/mcp.rs's header-map construction (HeaderName/HeaderValue) — same
# version axum/rmcp already pull in transitively, needed here directly
# since Rust doesn't expose a transitive dependency's API without an
# explicit edge.
http = { version = "1", optional = true }
# For src/mcp_oauth.rs's `CredentialStore` impl — rmcp's own trait is
# `#[async_trait]`-annotated (its "auth" feature pulls the crate in, but
# doesn't re-export the macro), same "explicit edge" reasoning as `http`
# above.
async-trait = { version = "0.1", optional = true }
# For src/preview.rs's reverse proxy to a sandbox pod — HTTP/1 over a
# port-forward stream, upgrades (a dev server's live-reload WebSocket)
# included. The same versions axum already pulls in.
hyper = { version = "1", features = ["client", "server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# For src/mcp_oauth.rs's callback route — percent-encoding an OAuth error
# message into a `?oauth_error=` redirect query param. Already present
# transitively (pulled in by `url`, itself pulled in by rmcp's "auth"
# feature), same "explicit edge" reasoning as `http`/`async-trait` above.
percent-encoding = { version = "2", optional = true }
# For src/webfetch.rs's SSRF guard — parsing a request URL to check its
# scheme and host before allowing the browser to connect. Already present
# transitively (see percent-encoding's own comment above), same "explicit
# edge" reasoning.
url = { version = "2", optional = true }
# "auth" adds rmcp's own MCP-spec OAuth client (discovery, dynamic client
# registration, PKCE, refresh) — see SME-16. Pulls
# in the `oauth2` crate transitively; no separate direct dependency needed
# since smelt only touches rmcp's re-exports of it.
# The language server catalog lookup (src/lsp/catalog.rs, SME-35): mason's
# package.yaml files and Helix's languages.toml. serde_yaml is deprecated;
# serde_norway is its maintained fork.
serde_norway = { version = "0.9", optional = true }
toml = { version = "1", optional = true }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "reqwest-tls-no-provider", "transport-streamable-http-client-reqwest", "auth"], optional = true }
# The reqwest 0.13 rmcp itself uses, by another name: an OAuth server's
# transport is rmcp's `AuthClient<reqwest::Client>` (SME-113), which needs
# a 0.13 `Client` to wrap, and smelt's own `reqwest` is 0.12. No features
# of its own, so Cargo unifies it with rmcp's: nothing new is compiled.
reqwest_rmcp = { package = "reqwest", version = "0.13", default-features = false, optional = true }

# For src/git.rs: generating ed25519 SSH keys and parsing imported ones
# (OpenSSH format) for the git settings page — see SME-32.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "ecdsa", "rand_core", "getrandom"], optional = true }

# Web-only: a wasm-compatible timer (tokio::time has no driver in a browser
# tab — there's no tokio runtime on the WASM client at all).
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }

[features]
web = ["dioxus/web", "dep:gloo-timers"]
server = [
    "dioxus/server",
    "tokio/full",
    "dep:dotenvy",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:sqlx",
    "dep:tower-http",
    "dep:futures-util",
    "dep:axum",
    "dep:kube",
    "dep:k8s-openapi",
    "dep:rustls",
    "dep:nix",
    "dep:tokio-tungstenite",
    "dep:sha2",
    "dep:ignore",
    "dep:regex",
    "dep:globset",
    "dep:rmcp",
    "dep:reqwest_rmcp",
    "dep:http",
    "dep:async-trait",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:chromiumoxide",
    "dep:url",
    "dep:ssh-key",
    "dep:serde_norway",
    "dep:toml",
]
# Separate from `server` so the default `cargo test --features server` loop
# stays exactly as fast as it is today — src/browser_tests.rs's one
# #[ignore]d test opts in explicitly. `chromiumoxide` itself moved to
# `server` proper once `webfetch` started using it as a real runtime
# dependency, not just a test one — see
# SME-10 and
# SME-21.
browser-test = ["server"]

# sandbox_agent runs standalone inside the sandbox pod (injected and
# launched by src/sandbox.rs, not served by main.rs) — it needs the same
# server-only dependencies (axum, tokio, serde_json, nix) but nothing
# Dioxus-related, so it's excluded from the default `cargo build`/`cargo
# check` (no features) and only builds under `server`.
[[bin]]
name = "sandbox_agent"
path = "src/bin/sandbox_agent.rs"
required-features = ["server"]

# Standalone CLI, run by scripts/build-sandbox-image.sh — see
# src/bin/sandbox_image_import.rs's own doc comment for why it isn't part
# of the main crate's module tree.
[[bin]]
name = "sandbox_image_import"
path = "src/bin/sandbox_image_import.rs"
required-features = ["server"]

[dev-dependencies]
# rmcp's server side, for the #[cfg(test)] mock MCP server in src/mcp.rs
# (its ServerHandler trait): tests only, so it stays out of the binary.
# Cargo unifies these features with the optional dependency above in test
# builds (SME-60).
rmcp = { version = "3.1.2", default-features = false, features = ["server"] }
# Paused time in tests (`#[tokio::test(start_paused = true)]`), for timeouts
# too long to wait out (SME-35's 120 s `initialize`).
tokio = { version = "1", features = ["test-util"] }
# syntect's CSS generation, for the test in src/highlight.rs that checks
# assets/highlight.css still matches the themes (SME-30): tests only.
syntect = { version = "5.3", default-features = false, features = ["html"] }

[build-dependencies]
# `build.rs` hashes the sources into `SMELT_BUILD_ID` (SME-43).
sha2 = "0.10"

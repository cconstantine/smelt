services:
  smelt:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    init: true
    depends_on:
      - postgres
      - docker
    volumes:
      - bash-history:/home/dev/.bash_history_dir
      - gh-config:/home/dev/.config/gh
      - claude-config:/home/dev/.claude
      - .:/app
    ports:
      - "8180:8080"
    # ANTHROPIC_API_KEY / ANTHROPIC_MODEL aren't set here: the app loads
    # ./.env itself at startup (bind-mounted below), and an unset var
    # substituted as "" would otherwise silently override that .env value
    # with an empty string instead of leaving it unset. Export them in your
    # host shell instead if you'd rather not use a .env file.
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      - DATABASE_URL=postgres://smelt:${POSTGRES_PASSWORD:-smelt}@postgres/smelt
      # Points the `docker` CLI (installed in the image, see Dockerfile) at
      # the `docker` sidecar below instead of a mounted host socket, so
      # `docker ps` in here only ever sees containers this project's own
      # nested daemon launched.
      - DOCKER_HOST=tcp://docker:2375
    # No auto-started dev server — exec in and run `dx serve` yourself so
    # cargo/test output isn't mixed with `docker compose up` logs:
    #   docker compose up -d
    #   docker compose exec smelt bash
    #   dx serve --fullstack --addr 0.0.0.0 --port 8080
    # (container's :8080 is published on the host as :8180, since :8080 is
    # already in use by another project's container on this machine)
    command: sleep infinity

  # Local/dev only — not reachable from the host (no `ports:`), only from
  # `smelt` over the compose network as `postgres:5432`. Credentials are
  # dev-only defaults, same pattern as UID/GID above: this is a
  # single-user local database, not a shared/production one.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smelt
      POSTGRES_USER: smelt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smelt}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Nested Docker daemon (Docker-in-Docker), not a forward of the host's —
  # `docker ps` from `smelt` only ever sees containers this daemon itself
  # launched. Costs the host's image cache (its own storage under
  # docker-data, so image pulls happen again) and `privileged: true` (a
  # real, broader blast radius than the socket-forwarding alternative) in
  # exchange for that isolation. TLS disabled (empty DOCKER_TLS_CERTDIR)
  # since, like postgres above, this never leaves the compose network.
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/var/lib/docker

volumes:
  bash-history:
  gh-config:
  claude-config:
  postgres-data:
  docker-data:
